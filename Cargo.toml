[workspace]
members = ["crates/rustroad-core", "crates/rustroad-formats", "crates/rustroad-workspace", "crates/rustroad-flow", "crates/rustroad-cli"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rustroad-core = { path = "crates/rustroad-core" }
rustroad-formats = { path = "crates/rustroad-formats" }
rustroad-workspace = { path = "crates/rustroad-workspace" }
rustroad-flow = { path = "crates/rustroad-flow" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
slotmap = "=1.1.1"
rayon = "=1.12.0"
memmap2 = "=0.9.11"
fs2 = "=0.4.3"
clap = { version = "=4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = "line-tables-only"
